# Render Deployment Configuration
spring.application.name=e-com

# Dynamic Port assigned by Render
server.port=${PORT:8086}

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecom?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Auto Schema Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Application Admin Credentials
app.admin.email=${ADMIN_EMAIL:adityakumar909763@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123SecurePass}
logging.file.name=ecom.log
logging.level.org.springframework.security=DEBUG

# Google OAuth2 Standard Provider
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=profile,email